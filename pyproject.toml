[project]
name = "anomaly-zero"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "earthaccess>=0.19.0",
    "fastapi>=0.162.7",
    "h5py>=3.16.0",
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
    "xarray>=2026.9.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
research = [
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "pyproj>=3.8.0",
    "pyshp>=3.1.8",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "statsmodels>=0.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
