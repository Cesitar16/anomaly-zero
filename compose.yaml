services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: ${ANOMALY_ZERO_PROCESSED_DIR:-./data/processed}
        target: /app/data/processed
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
