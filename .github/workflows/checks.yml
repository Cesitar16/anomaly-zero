name: Checks

on:
  pull_request:
    branches: [develop]
  push:
    branches: [feature/ful-103-earthdata-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Sync locked Python dependencies
        run: uv sync --locked --python 3.13 --group dev
      - name: Backend lint
        run: uv run ruff check backend
      - name: Offline backend tests
        run: uv run pytest
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: Frontend lint
        run: npm run lint --prefix frontend
      - name: Frontend type-check and build
        run: npm run build --prefix frontend
