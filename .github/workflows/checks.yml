name: Checks

on:
  pull_request:
    branches: [dev]
  push:
    branches: [feature/ful-103-earthdata-probe, feature/ful-106-be-02-three-product-samples]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Sync locked Python dependencies
        run: uv sync --locked --python 3.12 --group dev --group research
      - name: Backend lint
        run: uv run --locked --python 3.12 ruff check backend research
      - name: Offline backend tests
        run: uv run --locked --python 3.12 pytest backend/tests research/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: Frontend lint
        run: npm run lint --prefix frontend
      - name: Frontend tests
        run: npm test --prefix frontend
      - name: Frontend type-check and build
        run: npm run build --prefix frontend

