services:
  - type: web
    name: anomaly-zero-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health

  - type: web
    name: anomaly-zero-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_EXPLORE_API
        value: http
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
